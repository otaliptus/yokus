<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#c79563">
  <link rel="icon" href="data:,">
  <title>Yokuş</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <canvas id="world" aria-label="Yokuş, a wordless journey home"></canvas>
  <div id="opening" role="button" tabindex="0" aria-label="Click to begin Yokuş">
    <div class="sunwash"></div>
    <div class="opening-title">
      <span>Yokuş</span>
      <small id="opening-prompt">click to begin</small>
      <div id="opening-resume">
        <button id="continue-btn" type="button">continue</button>
        <button id="start-over-btn" type="button">restart</button>
      </div>
    </div>
  </div>
  <div id="memory-frame" aria-hidden="true"></div>
  <div id="ending-card" aria-live="polite">
    <div class="end-title">Yokuş</div>
    <div class="end-credit">A summer afternoon in Central Anatolia</div>
    <div id="music-credits"></div>
  </div>
  <div id="end-actions">
    <button id="replay-btn" type="button">walk up again</button>
    <button id="freekick-btn" type="button">unlimited free kicks</button>
    <button id="tea-btn" type="button">unlimited tea</button>
    <button id="bread-btn" type="button">unlimited bread</button>
  </div>
  <div id="fk-hud" aria-live="polite">
    <span id="fk-score">goals 0 · streak 0</span>
    <button id="fk-exit-btn" type="button">back to dusk</button>
  </div>
  <div id="mute-mark" aria-hidden="true">sound off</div>
  <div id="rotate-hint" role="status" aria-live="polite">
    <span class="rotate-icon" aria-hidden="true">↻</span>
    <span class="rotate-text">try holding your phone sideways</span>
    <button id="rotate-dismiss" type="button" aria-label="Dismiss rotate suggestion">×</button>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
